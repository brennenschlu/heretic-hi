/* Layout: a deadpan clone of a generic AI chat app (header, centered thread, docked composer). Heretic dark and yellow; Misfits blackletter only where a line needs punch. */
:root {
  --ink: #2c2b1e;          /* Heretic dark */
  --yellow: #ffba24;       /* Heretic yellow */
  --bg: #f5f3ec;
  --surface: #fffdf7;
  --fg: #2c2b1e;
  --muted: #6f6c5c;
  --line: #e2dfd2;
  --bubble: #eae6d8;
  --fire: #ffba24;         /* accent fill */
  --fire-ink: #2c2b1e;     /* text on accent fill */
  --accent-text: #8a5a00;  /* readable yellow-family text on light ground */
  --ok: #3f7a3a;
  --col: 680px;
  --orb: clamp(170px, 22vw, 250px);
  --display: "Misfits", "UnifrakturCook", "Old English Text MT", serif;
  --body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2c2b1e; --surface: #36352a; --fg: #f4f1e6; --muted: #aaa690;
    --line: #47463a; --bubble: #403f32; --fire: #ffba24; --fire-ink: #2c2b1e;
    --accent-text: #ffba24; --ok: #9fd18a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2c2b1e; --surface: #36352a; --fg: #f4f1e6; --muted: #aaa690;
  --line: #47463a; --bubble: #403f32; --fire: #ffba24; --fire-ink: #2c2b1e;
  --accent-text: #ffba24; --ok: #9fd18a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.app { height: 100%; display: flex; flex-direction: column; }

/* Header */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px max(16px, calc((100% - var(--col)) / 2)); border-bottom: 1px solid var(--line); background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { display: block; height: 40px; width: auto; color: var(--fg); }
.logo path { fill: currentColor; }
.model { position: relative; }
.model-btn {
  font: 500 13px var(--body); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.model-btn:hover { background: var(--surface); }
.model-btn svg { width: 12px; height: 12px; }
.menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; width: 260px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}
.menu button {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px;
  font: 14px var(--body); color: var(--fg); cursor: pointer; display: grid; gap: 1px;
}
.menu button:hover, .menu button:focus-visible { background: var(--bubble); }
.menu small { color: var(--muted); font-size: 12px; }
.menu .note { font: 12px var(--mono); color: var(--muted); padding: 8px 10px 4px; border-top: 1px solid var(--line); margin-top: 4px; }
.home { background: none; border: 0; padding: 4px 2px; cursor: pointer; color: var(--fg); border-radius: 6px; }
.actions { display: flex; align-items: center; gap: 6px; }
.newchat {
  font: 500 15px var(--body); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 9px 10px;
  display: inline-flex; align-items: center; gap: 5px; border-radius: 8px;
}
.newchat svg { width: 16px; height: 16px; }

    S = cv.clientWidth; dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    color = getComputedStyle(document.documentElement).getPropertyValue("--yellow").trim() || color;
  }
  function scaleAt(ph) {
    if (ph < 0.76) return 1 + 0.025 * Math.sin(ph * Math.PI * 6);
    if (ph < 0.85) return 1 - 0.9 * ease((ph - 0.76) / 0.09);
    if (ph < 0.89) return 0.1;
    return 0.1 + 0.9 * back((ph - 0.89) / 0.11);
  }
  function draw(t) {
    const c = S / 2, R = S * 0.3, ph = (t % CYCLE) / CYCLE, k = scaleAt(ph), rot = t * 0.00022;
    ctx.clearRect(0, 0, S, S);
    ctx.fillStyle = color; ctx.strokeStyle = color;
    const lx = c - R * 0.16 * k, ly = c - R * 0.12 * k;          // light point, up and left
    const maxD = R * 0.62;
    ctx.beginPath();
    for (let i = 1; i <= N; i++) {
      const rr = Math.sqrt(i / N);
      if (rr > 0.18 + 0.82 * Math.min(1, k)) continue;         // outer rings vanish while collapsed
      const a = i * GOLD + rot, r = rr * R * k;
      const x = c + Math.cos(a) * r, y = c + Math.sin(a) * r;
      const d = Math.hypot(x - lx, y - ly) / (R * Math.max(k, 0.35));
      let rad = maxD * 0.068 * Math.pow(Math.max(0, 1 - d / 1.18), 1.15) + 0.55;
      if (k < 0.5) rad *= 0.6 + 0.8 * k;
      ctx.moveTo(x + rad, y); ctx.arc(x, y, rad, 0, Math.PI * 2);
    }
    ctx.fill();
    const fade = Math.max(0, Math.min(1, (k - 0.3) / 0.7));
    if (fade > 0) {
      ctx.lineWidth = 1; ctx.globalAlpha = 0.6 * fade;
      for (const arc of arcs) {
        const a = arc.a0 + t * arc.v, rr = R * arc.r * (0.9 + 0.1 * k);
        ctx.beginPath(); ctx.arc(c, c, rr, a, a + arc.len); ctx.stroke();
        const sx = c + Math.cos(a + arc.len) * rr, sy = c + Math.sin(a + arc.len) * rr;
        ctx.globalAlpha = fade;
        ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.6 * fade;
      }
      ctx.globalAlpha = 1;
    }
  }
  size();
  if (reduced) { draw(1200); return; }
  function loop(t) {
    if (me !== orbRun || !cv.isConnected) return;
    if (cv.clientWidth !== S) size();
    draw(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* ---------------- Rendering ---------------- */
function scrollDown() { scroller.scrollTo({ top: scroller.scrollHeight, behavior: reduced ? "auto" : "smooth" }); }

function renderEmpty() {
  thread.innerHTML = "";
  const box = document.createElement("section");
  box.className = "empty";
  box.innerHTML = `
    <div class="hero">
      <canvas class="orb" id="orb" aria-hidden="true"></canvas>
      <h1>The last marketing tool you'll <em>ever need.</em></h1>
    </div>
    <p class="pitch">The most powerful model. The best context. <span class="nw">And it works <span class="fast">fast.</span><sup>*</sup></span></p>
    <dl class="specs">
      <div><dt>Context window</dt><dd>15+ years</dd></div>
      <div><dt>Training data</dt><dd>Real clients</dd></div>
      <div><dt>Hallucinations</dt><dd>Only on purpose</dd></div>
      <div><dt>Latency</dt><dd><span class="nw">Industry-leading<sup>*</sup></span></dd></div>
    </dl>
    <p class="footnote"><sup>*</sup>Real people do this. Fast means a few business days, maybe. It depends on how busy we are.</p>`;
  thread.appendChild(box);
  startOrb($("#orb", box));
}

function addUser(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="text">${esc(text)}</div>`;
  thread.appendChild(el); scrollDown();
}
function addBot() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `<div class="avatar" aria-hidden="true">H</div><div class="body"></div>`;
  thread.appendChild(el); scrollDown();
  return $(".body", el);
}
async function think(body, steps, g) {
  const box = document.createElement("div");
  box.className = "thinking";
  box.innerHTML = `<div class="dots" aria-label="Thinking"><span></span><span></span><span></span></div>`;
  body.appendChild(box); scrollDown();
  await sleep(reduced ? 200 : 700); alive(g);
  box.innerHTML = "";
  for (let i = 0; i < steps.length; i++) {
    const row = document.createElement("div");
    row.className = "row"; row.textContent = steps[i] + "…";
    box.appendChild(row); scrollDown();
    await sleep(reduced ? 150 : 650); alive(g);
    row.classList.add("done");
  }
  box.lastChild.classList.add("strike");
  await sleep(reduced ? 100 : 350); alive(g);
}
async function say(body, paras, g) {
  const wrap = document.createElement("div");
  wrap.className = "text"; body.appendChild(wrap);
  for (const p of paras) {
    const el = document.createElement("p");
    el.className = "caret"; wrap.appendChild(el);
    if (reduced) { el.innerHTML = p; }
    else {
      const words = p.split(" ");
      for (let i = 0; i < words.length; i++) {
        el.innerHTML = words.slice(0, i + 1).join(" ");
        if (i % 3 === 0) scrollDown();
        await sleep(28 + Math.random() * 40); alive(g);
      }
    }
    el.classList.remove("caret");
    await sleep(reduced ? 50 : 250); alive(g);
  }
  scrollDown();
}

/* ---------------- Ticket form ---------------- */
function ticketForm(body) {
  const f = document.createElement("form");
  f.className = "ticket"; f.noValidate = true;
  f.innerHTML = `
    <h2>Send this to a human</h2>
    <p class="sub">Your question goes to the Heretic team. Someone replies by email with an idea, not a summary.</p>
    <div class="field"><label for="t-email">Email</label><input id="t-email" type="email" autocomplete="email" placeholder="you@company.com" required></div>
    <div class="two">
      <div class="field"><label for="t-name">Name (optional)</label><input id="t-name" autocomplete="name"></div>
      <div class="field"><label for="t-co">Company (optional)</label><input id="t-co" autocomplete="organization"></div>
    </div>
    <div class="hp" aria-hidden="true"><label for="t-web">Website</label><input id="t-web" tabindex="-1" autocomplete="off"></div>
    <p class="err" hidden></p>
    <button class="primary" type="submit">Send to the team</button>`;
  body.appendChild(f); scrollDown();
  setTimeout(() => $("#t-email", f).focus({ preventScroll: true }), 50);
  return new Promise(resolve => {
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("#t-email", f).value.trim(), err = $(".err", f), btn = $(".primary", f);
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { err.textContent = "That email doesn't look right. Check for a typo and try again."; err.hidden = false; return; }
      if ($("#t-web", f).value) return; // bot trap
      err.hidden = true; btn.disabled = true; btn.textContent = "Sending…";
      state.email = email; state.name = $("#t-name", f).value.trim(); state.company = $("#t-co", f).value.trim();
      const ok = await submit(state.turns.join("\n\n---\n\n"));
      if (!ok) { btn.disabled = false; btn.textContent = "Send to the team"; err.textContent = "That didn't go through. Try again, or email hi@heretic.wtf directly."; err.hidden = false; return; }
      f.remove(); resolve();
    });
  });
}

async function submit(promptText) {
  const payload = {
    ticket: state.convo, prompt: promptText, email: state.email, name: state.name, company: state.company,
    model: state.model, submitted_at: new Date().toISOString(), page: location.href.split("#")[0],
  };
  if (!SUBMIT_URL) { console.info("[demo mode] would submit:", payload); await sleep(700); return true; }
  try {
    // Form-encoded + no-cors: the browser can post straight to the webhook without a server.
    // The response is unreadable in this mode, so a sent request counts as success.
    await fetch(SUBMIT_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams(payload) });
    return true;
  } catch { return false; }
}

function receipt(body, extra) {
  const el = document.createElement("div");
  el.className = "receipt";
  el.innerHTML = `<b>● Ticket ${state.convo} received</b><br>Reply to: ${esc(state.email)}<br>Model: ${esc(state.model)} (a person)<br>ETA: minutes to days${extra ? "<br>" + extra : ""}`;
  body.appendChild(el); scrollDown();
}

/* ---------------- Flow ---------------- */
async function submitPrompt() {
  if (state.busy) return;
  if (!ta.value.trim() && hint.current) ta.value = hint.current;
  const text = ta.value.trim();
  if (!text || state.busy) return;
  ta.value = ""; sizeTa();
  if ($(".empty")) thread.innerHTML = "";
  $("#stage").classList.add("chatting"); $("#app").classList.remove("home");
  addUser(text);
  state.turns.push(text);
  const g = state.gen;
  const body = addBot();
  try {
    if (state.awaiting) {
      // Email card is still open above: fold this into the same ticket.
      state.busy = true;
      await say(body, ["Love that. I'll bundle it with your first question. Drop your email in the card above and it all goes to the team together."], g);
    } else if (!state.email) {
      state.busy = true;
      await think(body, pick(THINKING), g);
      await say(body, [pick(OPENERS), pick(TURN), pick(ASK)], g);
      state.awaiting = true; state.busy = false;
      await ticketForm(body);
      alive(g);
      state.awaiting = false; state.busy = true;
      await say(body, [`Done. Your question is with the team. A real person will reply to <strong>${esc(state.email)}</strong> with an actual idea.`, "In the meantime, keep asking. I'll keep agreeing with you."], g);
      receipt(body);
    } else {
      state.busy = true;
      await think(body, ["Reading your follow-up", "Agreeing with it"], g);
      const ok = await submit(text);
      alive(g);
      await say(body, ok
        ? [pick(FOLLOW), `Added to ticket ${state.convo}. Same humans, same inbox.`]
        : ["That one didn't send. Try again in a moment, or email hi@heretic.wtf directly."], g);
    }
  } catch (e) { if (e !== CANCEL) throw e; return; }
  state.busy = false; hint.sync(); ta.focus({ preventScroll: true });
}

/* ---------------- Rotating suggestions in the composer ---------------- */
const hint = (() => {
  const base = "Ask the most advanced model anything";
  let i = 0, run = 0, running = false;
  const api = { current: "" };
  const set = (txt, full) => { ta.placeholder = txt; api.current = full; sendBtn.disabled = !ta.value.trim() && !api.current; };
  async function cycle() {
    const me = ++run; running = true;
    const on = () => me === run;
    set(base, ""); await sleep(1800); if (!on()) return;
    while (on()) {
      const t = SUGGESTIONS[i++ % SUGGESTIONS.length];
      if (reduced) { set(t, t); await sleep(3200); continue; }
      if (!on()) break;
      for (let n = 1; n <= t.length && on(); n++) { set(t.slice(0, n), ""); await sleep(34); }
      if (!on()) break;
      set(t, t); await sleep(2600);
      for (let n = t.length; n >= 0 && on(); n -= 2) { set(t.slice(0, n), ""); await sleep(14); }
      await sleep(300);
    }
  }
  api.sync = () => {
    const idle = !ta.value && !state.busy;
    if (idle && !running) cycle();
    if (!idle && running) { running = false; run++; set(base, ""); }
  };
  return api;
})();

/* ---------------- Composer + header ---------------- */
function sizeTa() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 180) + "px"; sendBtn.disabled = !ta.value.trim() && !hint.current; hint.sync(); }
ta.addEventListener("input", sizeTa);
ta.addEventListener("keydown", e => {
  if (e.key === "Tab" && !e.shiftKey && !ta.value && hint.current) { e.preventDefault(); ta.value = hint.current; sizeTa(); return; }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submitPrompt(); } });
$("#composer").addEventListener("submit", e => { e.preventDefault(); submitPrompt(); });

const menu = $("#menu"), mBtn = $("#modelBtn");
mBtn.addEventListener("click", () => { menu.hidden = !menu.hidden; mBtn.setAttribute("aria-expanded", String(!menu.hidden)); });
menu.querySelectorAll("[data-model]").forEach(b => b.addEventListener("click", () => {
  state.model = b.dataset.model; $("#modelName").textContent = state.model; menu.hidden = true; mBtn.setAttribute("aria-expanded", "false");
}));
document.addEventListener("click", e => { if (!e.target.closest(".model")) { menu.hidden = true; mBtn.setAttribute("aria-expanded", "false"); } });

function goHome() {
  $("#stage").classList.remove("chatting"); $("#app").classList.add("home");
  state.gen++; state.busy = false; state.awaiting = false;
  state.convo = newId(); state.turns = [];
  ta.value = ""; sizeTa(); renderEmpty(); scroller.scrollTop = 0;
}
$("#newChat").addEventListener("click", () => { goHome(); ta.focus({ preventScroll: true }); });
$("#home").addEventListener("click", goHome);

const cBtn = $("#contactBtn"), cPanel = $("#contact");
function setContact(open) { cPanel.hidden = !open; cBtn.setAttribute("aria-expanded", String(open)); }
cBtn.addEventListener("click", () => setContact(cPanel.hidden));
$("#copyEmail").addEventListener("click", async e => {
  const b = e.currentTarget;
  try { await navigator.clipboard.writeText("hi@heretic.wtf"); b.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents($("#contactEmail")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Selected"; }
  setTimeout(() => { b.textContent = "Copy"; }, 1600);
});
document.addEventListener("click", e => { if (!e.target.closest(".contact")) setContact(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { setContact(false); menu.hidden = true; } });

renderEmpty();
hint.sync();

</script>

</body>
